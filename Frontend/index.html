<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACC Platform</title>
    <meta name="theme-color" content="#F66435" />
    <script>
      // Open the dashboard in the theme it was last shown in, before the app loads,
      // so dark mode users never see a white flash. The public website stays light.
      (function () {
        try {
          var t = localStorage.getItem("acc-theme");
          if (t === "system") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if ((t === "dark" || t === "light") && location.pathname.indexOf("/dashboard") === 0) {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Paint dark mode straight away, before the app's own styles have loaded
         (same colour as --color-bg in the dark theme). */
      @media screen {
        html[data-theme="dark"] { color-scheme: dark; }
        html[data-theme="dark"], html[data-theme="dark"] body { background: #0F1115; }
      }
    </style>



    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />


  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
